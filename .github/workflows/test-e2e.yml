name: E2E Tests
# Deploy operator + Aerospike CE on Kind cluster, then run E2E tests (Podman auto-detected)

on:
  workflow_dispatch:
    inputs:
      ginkgo_label_filter:
        description: 'Ginkgo label filter (e.g. "!heavy")'
        required: false
        default: '!heavy'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'charts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    # Skip on PRs labeled 'heavy' so large/intentional PRs can opt out of e2e cost.
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'heavy')
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e GINKGO_FLAGS="-ginkgo.label-filter=${{ github.event.inputs.ginkgo_label_filter || '!heavy' }}"
