{{- if eq (include "aerospike-ce-kubernetes-operator.ui.web.enabled" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aerospike-ce-kubernetes-operator.ui.web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerospike-ce-kubernetes-operator.ui.web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "aerospike-ce-kubernetes-operator.ui.web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aerospike-ce-kubernetes-operator.ui.web.selectorLabels" . | nindent 8 }}
      {{- with .Values.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/ui/configmap.yaml") . | sha256sum }}
      {{- with .Values.ui.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "aerospike-ce-kubernetes-operator.ui.serviceAccountName" . }}
      # The web pod is a Next.js frontend with no Kubernetes API access requirement.
      # Mounting the SA token here would only widen attack surface (the SA itself is
      # shared with the api pod, which does need it for K8S_MANAGEMENT_ENABLED).
      automountServiceAccountToken: false
      {{- with .Values.ui.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.ui.terminationGracePeriodSeconds | default 45 }}
      containers:
        - name: web
          image: {{ include "aerospike-ce-kubernetes-operator.ui.web.image" . }}
          imagePullPolicy: {{ .Values.ui.web.image.pullPolicy }}
          ports:
            - name: web
              containerPort: {{ .Values.ui.web.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "aerospike-ce-kubernetes-operator.ui.fullname" . }}-config
            {{- if .Values.ui.web.copilot.enabled }}
            {{- if .Values.ui.web.copilot.existingSecret }}
            # ACKO Agent provider API key from a user-supplied Secret.
            - secretRef:
                name: {{ .Values.ui.web.copilot.existingSecret }}
            {{- else if .Values.ui.web.copilot.apiKey }}
            # ACKO Agent provider API key from the chart-managed Secret.
            - secretRef:
                name: {{ include "aerospike-ce-kubernetes-operator.ui.fullname" . }}-copilot
            {{- end }}
            {{- end }}
            {{- with .Values.ui.web.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.ui.web.extraEnv .Values.ui.extraEnv }}
          env:
            {{- with .Values.ui.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.ui.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.web.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.web.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.web.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          {{- with .Values.ui.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or (eq (include "aerospike-ce-kubernetes-operator.multiCluster.enabled" .) "true") (eq (include "aerospike-ce-kubernetes-operator.web.oidc.enabled" .) "true") }}
          volumeMounts:
            {{- if eq (include "aerospike-ce-kubernetes-operator.multiCluster.enabled" .) "true" }}
            - name: cluster-registry
              mountPath: /app/public/cluster-registry.json
              subPath: cluster-registry.json
              readOnly: true
            {{- end }}
            {{- if eq (include "aerospike-ce-kubernetes-operator.web.oidc.enabled" .) "true" }}
            - name: web-oidc-config
              mountPath: /app/public/web-oidc-config.json
              subPath: web-oidc-config.json
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or (eq (include "aerospike-ce-kubernetes-operator.multiCluster.enabled" .) "true") (eq (include "aerospike-ce-kubernetes-operator.web.oidc.enabled" .) "true") }}
      volumes:
        {{- if eq (include "aerospike-ce-kubernetes-operator.multiCluster.enabled" .) "true" }}
        - name: cluster-registry
          configMap:
            name: {{ include "aerospike-ce-kubernetes-operator.clusterRegistryConfigMapName" . }}
        {{- end }}
        {{- if eq (include "aerospike-ce-kubernetes-operator.web.oidc.enabled" .) "true" }}
        - name: web-oidc-config
          configMap:
            name: {{ include "aerospike-ce-kubernetes-operator.webOidcConfigMapName" . }}
        {{- end }}
      {{- end }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
