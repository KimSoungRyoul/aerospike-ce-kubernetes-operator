# Scenario C: HardRack Happy Path
#
# Verifies that the template's required anti-affinity places exactly 1 pod per node.
# Each rack is pinned to a different node via nodeName to confirm 1:1 mapping.
#
# Preconditions:
#   - hard-rack-test template (podAntiAffinityLevel: required, maxRacksPerNode: 1)
#   - Kind cluster: kind-worker, kind-worker2, kind-worker3
#
# Expected Results:
#   - All 3 pods Running
#   - rack 1 -> kind-worker, rack 2 -> kind-worker2, rack 3 -> kind-worker3
#
# Verification:
#   kubectl get pods -l app.kubernetes.io/instance=test-hard-happy -o wide
#   kubectl get pods -l app.kubernetes.io/instance=test-hard-happy \
#     -o jsonpath='{range .items[*]}{.metadata.name} -> {.spec.nodeName}{"\n"}{end}'
---
apiVersion: acko.io/v1alpha1
kind: AerospikeCluster
metadata:
  name: test-hard-happy
  namespace: default
spec:
  size: 3
  image: aerospike:ce-8.1.1.1
  templateRef:
    name: hard-rack-test
  rackConfig:
    namespaces:
      - data
    racks:
      - id: 1
        nodeName: kind-worker
      - id: 2
        nodeName: kind-worker2
      - id: 3
        nodeName: kind-worker3
  aerospikeConfig:
    namespaces:
      - name: data
        replication-factor: 2
        storage-engine:
          type: memory
          data-size: 1073741824
