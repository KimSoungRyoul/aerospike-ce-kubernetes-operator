{{- if and .Values.ui.enabled .Values.ui.ingress.enabled }}
{{- $target := .Values.ui.ingress.target | default "frontend" -}}
{{- if and (eq $target "frontendRenewal") (not .Values.ui.frontendRenewal.enabled) -}}
{{- fail "ui.ingress.target is 'frontendRenewal' but ui.frontendRenewal.enabled=false. Enable the renewal frontend or switch the ingress target to 'frontend' or 'backend'." -}}
{{- end -}}
{{- $targetServiceName := "" -}}
{{- if eq $target "backend" -}}
{{- $targetServiceName = include "aerospike-ce-kubernetes-operator.ui.backend.fullname" . -}}
{{- else if eq $target "frontendRenewal" -}}
{{- $targetServiceName = include "aerospike-ce-kubernetes-operator.ui.frontendRenewal.fullname" . -}}
{{- else if eq $target "frontend" -}}
{{- $targetServiceName = include "aerospike-ce-kubernetes-operator.ui.frontend.fullname" . -}}
{{- else -}}
{{- fail (printf "ui.ingress.target must be one of: frontend, frontendRenewal, backend (got %q)" $target) -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aerospike-ce-kubernetes-operator.ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerospike-ce-kubernetes-operator.ui.labels" . | nindent 4 }}
  {{- with .Values.ui.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ui.ingress.className }}
  ingressClassName: {{ .Values.ui.ingress.className }}
  {{- end }}
  {{- with .Values.ui.ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ui.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $targetServiceName }}
                port:
                  {{- if eq $target "backend" }}
                  name: backend
                  {{- else }}
                  name: frontend
                  {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
