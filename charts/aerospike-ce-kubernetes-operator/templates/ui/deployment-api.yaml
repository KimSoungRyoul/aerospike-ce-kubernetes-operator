{{- if eq (include "aerospike-ce-kubernetes-operator.ui.api.enabled" .) "true" }}
{{- if and .Values.ui.autoscaling.enabled .Values.ui.postgresql.enabled }}
{{- fail "ui.autoscaling.enabled and ui.postgresql.enabled cannot both be true. The embedded PostgreSQL sidecar is single-instance only. Disable ui.postgresql.enabled and provide ui.env.databaseUrl for an external database when using HPA." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aerospike-ce-kubernetes-operator.ui.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerospike-ce-kubernetes-operator.ui.api.labels" . | nindent 4 }}
spec:
  {{- /*
    Render `replicas` UNLESS an HPA is actually managing this Deployment.
    The HPA at templates/ui/hpa.yaml only targets the web Deployment, so the
    API never has an HPA. Skipping `replicas` here would let the apiserver
    default to 1 with nothing to scale it, regardless of `ui.replicaCount`.
    Suppress `replicas` only when BOTH the web HPA is active AND web is
    enabled (i.e. the HPA resource was actually rendered) — but even then
    the API is unmanaged, so we still emit replicas. Net effect: replicas
    is always emitted for the API Deployment until a per-API HPA exists.
  */}}
  replicas: {{ .Values.ui.replicaCount }}
  strategy:
    {{- if .Values.ui.postgresql.enabled }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "aerospike-ce-kubernetes-operator.ui.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aerospike-ce-kubernetes-operator.ui.api.selectorLabels" . | nindent 8 }}
      {{- with .Values.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/ui/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/ui/secret.yaml") . | sha256sum }}
      {{- with .Values.ui.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "aerospike-ce-kubernetes-operator.ui.serviceAccountName" . }}
      {{- if .Values.ui.hostNetwork }}
      hostNetwork: true
      dnsPolicy: {{ .Values.ui.dnsPolicy | default "ClusterFirstWithHostNet" }}
      {{- else if .Values.ui.dnsPolicy }}
      dnsPolicy: {{ .Values.ui.dnsPolicy }}
      {{- end }}
      {{- with .Values.ui.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.ui.terminationGracePeriodSeconds | default 45 }}
      {{- if .Values.ui.api.extraPipPackages }}
      initContainers:
        - name: install-extra-packages
          image: {{ include "aerospike-ce-kubernetes-operator.ui.api.image" . }}
          imagePullPolicy: {{ .Values.ui.api.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              pip install --target=/extra-packages --no-cache-dir \
              {{- range .Values.ui.api.extraPipPackages }} {{ . | quote }}{{- end }}
          volumeMounts:
            - name: extra-packages
              mountPath: /extra-packages
      {{- end }}
      containers:
        - name: api
          image: {{ include "aerospike-ce-kubernetes-operator.ui.api.image" . }}
          imagePullPolicy: {{ .Values.ui.api.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ .Values.ui.api.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "aerospike-ce-kubernetes-operator.ui.fullname" . }}-config
            - secretRef:
                name: {{ .Values.ui.postgresql.existingSecret | default (printf "%s-db" (include "aerospike-ce-kubernetes-operator.ui.fullname" .)) }}
            {{- with .Values.ui.api.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.ui.api.extraPipPackages }}
            - name: PYTHONPATH
              value: /extra-packages
            {{- end }}
            {{- if .Values.ui.api.otel.enabled }}
            - name: OTEL_SDK_DISABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ required "ui.api.otel.endpoint is required when ui.api.otel.enabled is true" .Values.ui.api.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.ui.api.otel.protocol | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.ui.api.otel.sampler | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.ui.api.otel.samplerArg | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.ui.api.otel.serviceName | quote }}
            {{- with .Values.ui.api.otel.resourceAttributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.ui.api.otel.headers }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ . | quote }}
            {{- end }}
            {{- else }}
            - name: OTEL_SDK_DISABLED
              value: "true"
            {{- end }}
            {{- if eq (include "aerospike-ce-kubernetes-operator.api.oidc.enabled" .) "true" }}
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_ISSUER_URL
              value: {{ required "ui.api.auth.oidc.issuerUrl is required when ui.api.auth.oidc.enabled is true" .Values.ui.api.auth.oidc.issuerUrl | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.ui.api.auth.oidc.audience | quote }}
            - name: OIDC_REQUIRED_ROLES
              value: {{ join "," .Values.ui.api.auth.oidc.requiredRoles | quote }}
            - name: OIDC_JWKS_CACHE_TTL
              value: {{ .Values.ui.api.auth.oidc.jwksCacheTTL | quote }}
            - name: OIDC_EXCLUDE_PATHS
              value: {{ join "," .Values.ui.api.auth.oidc.excludePaths | quote }}
            {{- end }}
            {{- with .Values.ui.api.logging.handlers }}
            - name: LOG_HANDLERS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.ui.api.logging.dictConfig }}
            - name: LOGGING_CONFIG_FILE
              value: /etc/asm/logging.yaml
            {{- else if .Values.ui.api.logging.configFile }}
            - name: LOGGING_CONFIG_FILE
              value: {{ .Values.ui.api.logging.configFile | quote }}
            {{- end }}
            {{- with .Values.ui.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.ui.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.api.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.api.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.api.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          {{- with .Values.ui.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.ui.api.extraVolumeMounts .Values.ui.api.extraPipPackages .Values.ui.api.logging.dictConfig }}
          volumeMounts:
            {{- with .Values.ui.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.ui.api.extraPipPackages }}
            - name: extra-packages
              mountPath: /extra-packages
              readOnly: true
            {{- end }}
            {{- if .Values.ui.api.logging.dictConfig }}
            - name: logging-config
              mountPath: /etc/asm
              readOnly: true
            {{- end }}
          {{- end }}
        {{- if .Values.ui.postgresql.enabled }}
        - name: postgres
          image: "{{ .Values.ui.postgresql.image.repository }}:{{ .Values.ui.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.ui.postgresql.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.ui.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.ui.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ui.postgresql.existingSecret | default (printf "%s-db" (include "aerospike-ce-kubernetes-operator.ui.fullname" .)) }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.ui.postgresql.username }}
                - -d
                - {{ .Values.ui.postgresql.database }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.ui.postgresql.username }}
                - -d
                - {{ .Values.ui.postgresql.database }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.ui.postgresql.username }}
                - -d
                - {{ .Values.ui.postgresql.database }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - SETGID
                - SETUID
          {{- with .Values.ui.postgresql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
        {{- end }}
      {{- if or .Values.ui.postgresql.enabled .Values.ui.api.extraVolumes .Values.ui.api.extraPipPackages .Values.ui.api.logging.dictConfig }}
      volumes:
        {{- if .Values.ui.postgresql.enabled }}
        - name: data
          {{- if .Values.ui.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "aerospike-ce-kubernetes-operator.ui.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.ui.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.ui.api.extraPipPackages }}
        - name: extra-packages
          emptyDir: {}
        {{- end }}
        {{- if .Values.ui.api.logging.dictConfig }}
        - name: logging-config
          configMap:
            name: {{ include "aerospike-ce-kubernetes-operator.ui.api.fullname" . }}-logging
        {{- end }}
      {{- end }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
