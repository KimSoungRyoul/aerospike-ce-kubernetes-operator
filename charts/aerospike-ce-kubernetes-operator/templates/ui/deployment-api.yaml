{{- if eq (include "aerospike-ce-kubernetes-operator.ui.api.enabled" .) "true" }}
{{- /* ui.database.type=sqlite vs ui.replicaCount>1 is validated centrally in
       the "...validate.databaseConfig" helper (rendered via NOTES.txt). */}}
{{- if and .Values.ui.api.logging.sidecar.enabled (not .Values.ui.api.logging.fileMirror.enabled) }}
{{- fail "ui.api.logging.sidecar.enabled=true requires ui.api.logging.fileMirror.enabled=true. Without the file mirror the sidecar has nothing to tail. Either enable fileMirror, or rely on a node-level OTel Collector DaemonSet scraping container logs instead." }}
{{- end }}
{{- if and .Values.ui.api.logging.sidecar.enabled (not .Values.ui.api.logging.sidecar.config.content) (not .Values.ui.api.logging.sidecar.otlp.endpoint) }}
{{- fail "ui.api.logging.sidecar.enabled=true requires either ui.api.logging.sidecar.otlp.endpoint (to use the default fluent-bit OTLP forwarder config) or ui.api.logging.sidecar.config.content (to bring your own shipper config)." }}
{{- end }}
{{- if .Values.ui.api.logging.sidecar.config.content }}
{{- /*
  Block YAML-toxic content from ui.api.logging.sidecar.config.content:
  - "---" inside the value risks splitting the ConfigMap into multiple
    YAML documents when rendered through `nindent`. Even when block-scalar
    indentation keeps a single document intact, a downstream `kubectl
    diff` / GitOps tool that re-parses the rendered manifest can still
    trip on it.
  - A leading "%" is a YAML directive marker and is unsafe in any context.
  Catch both at install time with a clear error rather than ship a
  broken ConfigMap that fails on apply with an opaque parser message.
*/}}
{{- if contains "\n---" (printf "\n%s" .Values.ui.api.logging.sidecar.config.content) }}
{{- fail "ui.api.logging.sidecar.config.content must not contain a '---' line (YAML document separator). Inline the directives without document separators, or supply the config via `ui.api.logging.sidecar.extraVolumeMounts` referencing your own ConfigMap." }}
{{- end }}
{{- if hasPrefix "%" .Values.ui.api.logging.sidecar.config.content }}
{{- fail "ui.api.logging.sidecar.config.content must not start with '%' (YAML directive marker). Indent the first line or supply the config via `ui.api.logging.sidecar.extraVolumeMounts` referencing your own ConfigMap." }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aerospike-ce-kubernetes-operator.ui.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerospike-ce-kubernetes-operator.ui.api.labels" . | nindent 4 }}
spec:
  {{- /*
    Render `replicas` UNLESS an HPA is actually managing this Deployment.
    The HPA at templates/ui/hpa.yaml only targets the web Deployment, so the
    API never has an HPA. Skipping `replicas` here would let the apiserver
    default to 1 with nothing to scale it, regardless of `ui.replicaCount`.
    Suppress `replicas` only when BOTH the web HPA is active AND web is
    enabled (i.e. the HPA resource was actually rendered) — but even then
    the API is unmanaged, so we still emit replicas. Net effect: replicas
    is always emitted for the API Deployment until a per-API HPA exists.
  */}}
  replicas: {{ .Values.ui.replicaCount }}
  strategy:
    {{- if eq .Values.ui.database.type "sqlite" }}
    {{- /* SQLite lives on a single ReadWriteOnce PVC; a RollingUpdate would
           briefly schedule a surge pod that cannot attach the volume. */}}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "aerospike-ce-kubernetes-operator.ui.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aerospike-ce-kubernetes-operator.ui.api.selectorLabels" . | nindent 8 }}
      {{- with .Values.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/ui/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/ui/secret.yaml") . | sha256sum }}
        {{- if .Values.ui.database.postgresql.deploy }}
        checksum/db-secret: {{ include (print $.Template.BasePath "/ui/postgres-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.ui.api.logging.sidecar.enabled }}
        checksum/log-shipper-config: {{ include (print $.Template.BasePath "/ui/configmap-log-shipper.yaml") . | sha256sum }}
        {{- end }}
      {{- with .Values.ui.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "aerospike-ce-kubernetes-operator.ui.serviceAccountName" . }}
      {{- if .Values.ui.hostNetwork }}
      hostNetwork: true
      dnsPolicy: {{ .Values.ui.dnsPolicy | default "ClusterFirstWithHostNet" }}
      {{- else if .Values.ui.dnsPolicy }}
      dnsPolicy: {{ .Values.ui.dnsPolicy }}
      {{- end }}
      {{- with .Values.ui.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.ui.terminationGracePeriodSeconds | default 45 }}
      {{- $pgManaged := and (eq .Values.ui.database.type "postgresql") .Values.ui.database.postgresql.deploy -}}
      {{- if or .Values.ui.api.extraPipPackages $pgManaged }}
      initContainers:
        {{- if $pgManaged }}
        {{- /* Block api startup until the chart-managed PostgreSQL accepts
               connections, so the api does not crash-loop on first install
               while the database is still initialising. `-U` is passed
               explicitly: this container inherits the UI pod's runAsUser
               (1001), which has no /etc/passwd entry in the postgres image,
               and libpq tools report "no attempt" if they must look the
               current uid up to derive a default user. */}}
        - name: wait-for-postgres
          image: "{{ .Values.ui.database.postgresql.image.repository }}:{{ .Values.ui.database.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.ui.database.postgresql.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "aerospike-ce-kubernetes-operator.ui.postgres.fullname" . }} -p 5432 -U '{{ .Values.ui.database.postgresql.auth.username }}'; do
                echo "waiting for PostgreSQL to accept connections..."
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          {{- with .Values.ui.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if .Values.ui.api.extraPipPackages }}
        - name: install-extra-packages
          image: {{ include "aerospike-ce-kubernetes-operator.ui.api.image" . }}
          imagePullPolicy: {{ .Values.ui.api.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              pip install --target=/extra-packages --no-cache-dir \
              {{- range .Values.ui.api.extraPipPackages }} {{ . | quote }}{{- end }}
          volumeMounts:
            - name: extra-packages
              mountPath: /extra-packages
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "aerospike-ce-kubernetes-operator.ui.api.containerName" . }}
          image: {{ include "aerospike-ce-kubernetes-operator.ui.api.image" . }}
          imagePullPolicy: {{ .Values.ui.api.image.pullPolicy }}
          ports:
            - name: {{ include "aerospike-ce-kubernetes-operator.ui.api.containerName" . }}
              containerPort: {{ .Values.ui.api.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "aerospike-ce-kubernetes-operator.ui.fullname" . }}-config
            {{- if and (eq .Values.ui.database.type "postgresql") (not .Values.ui.database.postgresql.deploy) }}
            {{- /* External PostgreSQL: the -db / existingSecret carries only
                   DATABASE_URL, so envFrom is safe. The chart-managed Secret
                   also holds POSTGRES_PASSWORD, so that case injects just
                   DATABASE_URL explicitly below instead of envFrom. */}}
            - secretRef:
                name: {{ include "aerospike-ce-kubernetes-operator.ui.database.secretName" . }}
            {{- end }}
            {{- with .Values.ui.api.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if and (eq .Values.ui.database.type "postgresql") .Values.ui.database.postgresql.deploy }}
            {{- /* Chart-managed PostgreSQL: inject only DATABASE_URL — the
                   shared Secret also holds POSTGRES_PASSWORD, which the api
                   does not need, so it is not pulled in via envFrom. */}}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "aerospike-ce-kubernetes-operator.ui.database.secretName" . }}
                  key: DATABASE_URL
            {{- end }}
            {{- if .Values.ui.api.extraPipPackages }}
            - name: PYTHONPATH
              value: /extra-packages
            {{- end }}
            {{- with .Values.ui.api.otel.aerospikePyLogLevel }}
            # aerospike-py Rust-core log bridge verbosity. Applies regardless
            # of otel.enabled — the bridge routes to stdout either way.
            - name: AEROSPIKE_PY_LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.ui.api.otel.enabled }}
            - name: OTEL_SDK_DISABLED
              value: "false"
            # Start aerospike-py's native OTLP span exporter. Only meaningful
            # when OTel is enabled, so it is set alongside the OTel env.
            - name: AEROSPIKE_PY_TRACING
              value: {{ .Values.ui.api.otel.aerospikePyTracing | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "aerospike-ce-kubernetes-operator.otel.normalizeEndpoint" (required "ui.api.otel.endpoint is required when ui.api.otel.enabled is true" .Values.ui.api.otel.endpoint) | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.ui.api.otel.protocol | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.ui.api.otel.sampler | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.ui.api.otel.samplerArg | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.ui.api.otel.serviceName | quote }}
            {{- with .Values.ui.api.otel.resourceAttributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.ui.api.otel.headers }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ . | quote }}
            {{- end }}
            {{- else }}
            - name: OTEL_SDK_DISABLED
              value: "true"
            {{- end }}
            {{- if eq (include "aerospike-ce-kubernetes-operator.api.oidc.enabled" .) "true" }}
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_ISSUER_URL
              value: {{ required "ui.api.auth.oidc.issuerUrl is required when ui.api.auth.oidc.enabled is true" .Values.ui.api.auth.oidc.issuerUrl | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.ui.api.auth.oidc.audience | quote }}
            - name: OIDC_REQUIRED_ROLES
              value: {{ join "," .Values.ui.api.auth.oidc.requiredRoles | quote }}
            - name: OIDC_JWKS_CACHE_TTL
              value: {{ .Values.ui.api.auth.oidc.jwksCacheTTL | quote }}
            - name: OIDC_EXCLUDE_PATHS
              value: {{ join "," .Values.ui.api.auth.oidc.excludePaths | quote }}
            {{- end }}
            {{- if .Values.ui.api.logging.fileMirror.enabled }}
            - name: LOG_FILE_PATH
              value: {{ .Values.ui.api.logging.fileMirror.path | quote }}
            {{- /*
              `| quote` on a JSON number >= 1e7 renders it in scientific
              notation (e.g. "5.24288e+07"), which Python's int() rejects
              with ValueError on startup. Force a decimal-int representation
              via `printf "%d"` so 52428800 stays "52428800".
            */}}
            - name: LOG_FILE_MAX_BYTES
              value: {{ printf "%d" (.Values.ui.api.logging.fileMirror.maxBytes | int) | quote }}
            - name: LOG_FILE_BACKUP_COUNT
              value: {{ printf "%d" (.Values.ui.api.logging.fileMirror.backupCount | int) | quote }}
            {{- end }}
            {{- with .Values.ui.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.ui.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /*
            Probe `httpGet.port` is always rewritten to the container/port
            name (see the `ui.api.probe` helper) so that overriding
            `ui.api.containerName` does not leave the probes pointing at a
            non-existent named port. Users can still customise path /
            timing / scheme / host via `ui.api.{liveness,readiness,startup}Probe`.
          */}}
          {{- with .Values.ui.api.livenessProbe }}
          livenessProbe:
            {{- include "aerospike-ce-kubernetes-operator.ui.api.probe" (dict "probe" . "ctx" $) | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.api.readinessProbe }}
          readinessProbe:
            {{- include "aerospike-ce-kubernetes-operator.ui.api.probe" (dict "probe" . "ctx" $) | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.api.startupProbe }}
          startupProbe:
            {{- include "aerospike-ce-kubernetes-operator.ui.api.probe" (dict "probe" . "ctx" $) | nindent 12 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          {{- with .Values.ui.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or (eq .Values.ui.database.type "sqlite") .Values.ui.api.extraVolumeMounts .Values.ui.api.extraPipPackages .Values.ui.api.logging.fileMirror.enabled .Values.ui.api.logging.sidecar.enabled }}
          volumeMounts:
            {{- if eq .Values.ui.database.type "sqlite" }}
            {{- /* SQLite database file (SQLITE_PATH=/app/data/connections.db). */}}
            - name: acm-data
              mountPath: /app/data
            {{- end }}
            {{- with .Values.ui.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.ui.api.extraPipPackages }}
            - name: extra-packages
              mountPath: /extra-packages
              readOnly: true
            {{- end }}
            {{- if or .Values.ui.api.logging.fileMirror.enabled .Values.ui.api.logging.sidecar.enabled }}
            - name: acm-logs
              mountPath: {{ .Values.ui.api.logging.fileMirror.mountPath | quote }}
            {{- end }}
          {{- end }}
        {{- if .Values.ui.api.logging.sidecar.enabled }}
        - name: log-shipper
          image: "{{ .Values.ui.api.logging.sidecar.image.repository }}:{{ .Values.ui.api.logging.sidecar.image.tag }}"
          imagePullPolicy: {{ .Values.ui.api.logging.sidecar.image.pullPolicy }}
          {{- with .Values.ui.api.logging.sidecar.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.api.logging.sidecar.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.api.logging.sidecar.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.api.logging.sidecar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.api.logging.sidecar.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: acm-logs
              mountPath: {{ .Values.ui.api.logging.fileMirror.mountPath | quote }}
              readOnly: true
            - name: log-shipper-config
              mountPath: {{ .Values.ui.api.logging.sidecar.config.mountPath | quote }}
              subPath: {{ .Values.ui.api.logging.sidecar.config.subPath | quote }}
              readOnly: true
            {{- with .Values.ui.api.logging.sidecar.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
      {{- if or (eq .Values.ui.database.type "sqlite") .Values.ui.api.extraVolumes .Values.ui.api.extraPipPackages .Values.ui.api.logging.fileMirror.enabled .Values.ui.api.logging.sidecar.enabled }}
      volumes:
        {{- if eq .Values.ui.database.type "sqlite" }}
        - name: acm-data
          {{- if .Values.ui.database.sqlite.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "aerospike-ce-kubernetes-operator.ui.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.ui.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.ui.api.extraPipPackages }}
        - name: extra-packages
          emptyDir: {}
        {{- end }}
        {{- if or .Values.ui.api.logging.fileMirror.enabled .Values.ui.api.logging.sidecar.enabled }}
        - name: acm-logs
          emptyDir: {}
        {{- end }}
        {{- if .Values.ui.api.logging.sidecar.enabled }}
        - name: log-shipper-config
          configMap:
            name: {{ include "aerospike-ce-kubernetes-operator.ui.api.fullname" . }}-log-shipper
        {{- end }}
      {{- end }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
