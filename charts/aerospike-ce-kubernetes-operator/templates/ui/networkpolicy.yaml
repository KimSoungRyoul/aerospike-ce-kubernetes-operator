{{- if and (eq (include "aerospike-ce-kubernetes-operator.ui.anyEnabled" .) "true") .Values.ui.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aerospike-ce-kubernetes-operator.ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerospike-ce-kubernetes-operator.ui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aerospike-ce-kubernetes-operator.ui.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        {{- if eq (include "aerospike-ce-kubernetes-operator.ui.api.enabled" .) "true" }}
        - port: {{ .Values.ui.api.service.targetPort }}
          protocol: TCP
        {{- end }}
        {{- if eq (include "aerospike-ce-kubernetes-operator.ui.web.enabled" .) "true" }}
        - port: {{ .Values.ui.web.service.port }}
          protocol: TCP
        {{- end }}
        {{- if and (eq .Values.ui.database.type "postgresql") .Values.ui.database.postgresql.deploy }}
        {{- /* This NetworkPolicy's podSelector also matches the chart-managed
               PostgreSQL pod (it shares the ui.selectorLabels); allow the
               api -> PostgreSQL connection on 5432. */}}
        - port: 5432
          protocol: TCP
        {{- end }}
      {{- with .Values.ui.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS (restricted to kube-system namespace)
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    # K8s API server
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # Aerospike clusters (within cluster network)
    - ports:
        - port: {{ .Values.ui.aerospikePorts.service }}
          protocol: TCP
        - port: {{ .Values.ui.aerospikePorts.fabric }}
          protocol: TCP
        - port: {{ .Values.ui.aerospikePorts.heartbeat }}
          protocol: TCP
    {{- if eq .Values.ui.database.type "postgresql" }}
    # PostgreSQL (external instance or chart-managed pod)
    - ports:
        - port: 5432
          protocol: TCP
    {{- end }}
{{- end }}
