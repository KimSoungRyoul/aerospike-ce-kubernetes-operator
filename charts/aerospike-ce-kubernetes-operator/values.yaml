# =============================================================================
# Aerospike CE Kubernetes Operator - Helm Values
# =============================================================================

# =============================================================================
# Operator (controller-manager) deployment toggle
# =============================================================================
# Setting `operator.enabled=false` disables every operator-related resource:
# the controller Deployment, ServiceAccount/RBAC, webhook configurations,
# cert-manager Certificate, metrics Service/ServiceMonitor, PrometheusRule,
# Grafana dashboard, HPA, PDB, NetworkPolicy/CiliumNetworkPolicy, and the
# default AerospikeClusterTemplates. The chart then renders only the UI
# (api / web) and shared resources you have enabled.
#
# Useful for the multi-cluster topology where one "common" cluster hosts only
# the web frontend and dev/prod clusters host operator + api individually.
# Default `true` preserves backwards compatibility for single-cluster installs.
operator:
  # -- Deploy the controller-manager (operator) and all of its supporting
  # resources. Disable to render UI-only / web-only installs.
  enabled: true

# =============================================================================
# Multi-cluster topology (cluster registry served to the web UI)
# =============================================================================
# Provides a static cluster registry to the web frontend so a single SPA can
# pivot between multiple ACKO API endpoints (typically one per environment).
# When enabled, a ConfigMap named `<release>-cluster-registry` is rendered
# with key `cluster-registry.json` and mounted into the web pod so the SPA
# can fetch it via `/cluster-registry.json` at boot. Mutually exclusive with
# `ui.web.env.apiUrl` (single-API override) — using both is ambiguous and
# fails template rendering.
multiCluster:
  # -- Enable multi-cluster registry rendering.
  enabled: false
  # -- Default cluster ID the SPA selects on first load. Must match one of
  # the entries in `clusters` below.
  defaultClusterId: ""
  # -- List of clusters available to the web UI. Each entry is shipped as-is
  # in `cluster-registry.json` and is consumed by the SPA's cluster selector.
  # Schema: { id, displayName, apiUrl, labels{} }
  # Example:
  #   clusters:
  #     - id: dev
  #       displayName: "Dev"
  #       apiUrl: "https://dev-api.example.com"
  #       labels:
  #         env: dev
  #     - id: prod
  #       displayName: "Prod"
  #       apiUrl: "https://prod-api.example.com"
  #       labels:
  #         env: prod
  clusters: []

# =============================================================================
# Aerospike Images (used by default templates and UI wizard)
# =============================================================================
# Override these for air-gapped environments where Docker Hub is unreachable.
# Example: aerospikeImages.aerospike: "internal-registry.example.com/aerospike:ce-8.1.1.1"
aerospikeImages:
  # -- Default Aerospike CE server image
  aerospike: "aerospike:ce-8.1.1.1"
  # -- Default Prometheus exporter sidecar image
  exporter: "aerospike/aerospike-prometheus-exporter:1.16.1"

# =============================================================================
# CRD Management
# =============================================================================
crds:
  # -- Install aerospike-ce-kubernetes-operator-crds as a subchart dependency.
  # Set to false if you have already installed aerospike-ce-kubernetes-operator-crds separately,
  # e.g., via GitOps (ArgoCD/Flux) or manual `helm install aerospike-ce-kubernetes-operator-crds`.
  install: true
  # -- Retain CRDs on `helm uninstall` (documentation only).
  # The actual keep behavior is enforced by the helm.sh/resource-policy: keep
  # annotation on each CRD template in the aerospike-ce-kubernetes-operator-crds chart.
  keep: true

# -- Number of operator replicas. Typically 1 is sufficient as leader election
# handles HA. Increase for faster failover.
replicaCount: 1

# -- Operator container image settings
image:
  # -- Container image repository
  repository: ghcr.io/aerospike-ce-ecosystem/aerospike-ce-kubernetes-operator
  # -- Container image tag. Leave empty to fall through to .Chart.AppVersion
  # so installs are pinned to the chart's matching operator release. Avoid
  # using "latest" — it makes deployments unreproducible and silently
  # interacts with imagePullPolicy: IfNotPresent (cached :latest never gets
  # refreshed).
  tag: ""
  # -- Image pull policy: Always, IfNotPresent, or Never
  pullPolicy: IfNotPresent

# -- List of image pull secrets for private registries
# Example:
#   imagePullSecrets:
#     - name: my-registry-secret
imagePullSecrets: []

# -- Override the chart name used in resource names
nameOverride: ""
# -- Override the full resource name (takes precedence over nameOverride)
fullnameOverride: ""

# =============================================================================
# Service Account
# =============================================================================
serviceAccount:
  # -- Annotations to add to the operator service account
  # Useful for IAM roles (e.g., EKS IRSA, GKE Workload Identity)
  annotations: {}

# =============================================================================
# Resource Limits
# =============================================================================
# -- CPU and memory resource requests/limits for the operator pod.
# Memory is aligned with config/manager/manager.yaml (kustomize manifest);
# the previous 256Mi limit / 128Mi request risked OOMKill once
# MaxConcurrentReconciles=2 fans out across many AerospikeClusters.
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# =============================================================================
# Webhook Configuration
# =============================================================================
webhook:
  # -- Enable admission webhooks for CR validation and defaulting
  enabled: true
  # -- Webhook server listen port
  port: 9443

# =============================================================================
# cert-manager Integration
# =============================================================================
certManager:
  # -- Use cert-manager to provision webhook TLS certificates.
  # This controls whether Certificate/Issuer resources are created.
  # Requires cert-manager to be pre-installed in the cluster.
  # Install cert-manager separately before installing this chart:
  #   helm install cert-manager jetstack/cert-manager --set crds.enabled=true
  # Alternatively, disable cert-manager integration and provide a TLS secret manually
  # via webhookTlsSecret below.
  enabled: true

  # -- Issuer configuration for cert-manager
  issuer:
    # -- Issuer type: "selfSigned", "ca", or "clusterIssuer"
    # - selfSigned: creates a self-signed Issuer (default, good for development)
    # - ca: uses an existing CA secret to sign certificates
    # - clusterIssuer: references an existing ClusterIssuer by name
    type: selfSigned

    # -- Name of an existing ClusterIssuer (only used when type is "clusterIssuer")
    name: ""

    # -- CA secret name containing tls.crt and tls.key (only used when type is "ca")
    caSecretName: ""

  # -- Certificate duration (default: 8760h = 1 year)
  duration: ""
  # -- Certificate renewal time before expiry (default: 2880h = 120 days)
  renewBefore: ""

# -- Manually provide a TLS secret for the webhook server.
# Only used when certManager.enabled is false and webhook.enabled is true.
# The secret must contain tls.crt and tls.key.
# Example: webhookTlsSecret: "my-webhook-tls"
webhookTlsSecret: ""

# =============================================================================
# Monitoring - ServiceMonitor (Prometheus Operator)
# =============================================================================
serviceMonitor:
  # -- Create a ServiceMonitor resource for Prometheus Operator
  enabled: false
  # -- Scrape interval (e.g., "30s")
  interval: ""
  # -- Scrape timeout (e.g., "10s")
  scrapeTimeout: ""
  # -- Additional labels for the ServiceMonitor (useful for Prometheus selection)
  additionalLabels: {}

# =============================================================================
# Monitoring - PrometheusRule (Alerting Rules)
# =============================================================================
prometheusRule:
  # -- Create PrometheusRule resource with Aerospike operator alerting rules
  enabled: false
  # -- Additional labels for the PrometheusRule (useful for Prometheus selection)
  additionalLabels: {}
  # -- Custom alerting rules to append or override defaults.
  # When empty, built-in default rules are used.
  # Example:
  #   rules:
  #     - alert: CustomAerospikeAlert
  #       expr: up{job="aerospike"} == 0
  #       for: 5m
  #       labels:
  #         severity: critical
  #       annotations:
  #         summary: "Custom Aerospike alert"
  rules: []

# =============================================================================
# Monitoring - Grafana Dashboard
# =============================================================================
grafanaDashboard:
  # -- Create a ConfigMap with a Grafana dashboard for the Aerospike operator.
  # Requires Grafana sidecar to be configured with dashboard auto-discovery.
  enabled: false
  # -- Grafana sidecar label key for dashboard auto-discovery
  sidecarLabel: grafana_dashboard
  # -- Grafana sidecar label value
  sidecarLabelValue: "1"
  # -- Grafana folder annotation for organizing dashboards
  folder: ""

# =============================================================================
# Network Policy (standard Kubernetes NetworkPolicy)
# =============================================================================
networkPolicy:
  # -- Create standard Kubernetes NetworkPolicy resources
  # Mutually exclusive with cilium.enabled
  enabled: false

# =============================================================================
# Cilium Network Policy
# =============================================================================
cilium:
  # -- Create CiliumNetworkPolicy resources instead of standard NetworkPolicy.
  # Mutually exclusive with networkPolicy.enabled.
  # Requires Cilium CNI to be installed in the cluster.
  enabled: false
  # -- Enable L7 (application-layer) policy rules for Aerospike ports
  l7Enabled: false

# =============================================================================
# Pod Disruption Budget
# =============================================================================
podDisruptionBudget:
  # -- Create a PodDisruptionBudget for the operator deployment.
  # Enabled by default so that voluntary disruptions (cluster autoscaler
  # scale-in, controlled rollouts) respect a budget and don't take the
  # operator offline simultaneously with Aerospike pods that need it.
  enabled: true
  # -- Minimum available pods (mutually exclusive with maxUnavailable).
  # Leave empty unless you scale `replicaCount` above 1; setting
  # minAvailable=1 with replicaCount=1 makes the operator pod un-evictable
  # and blocks `kubectl drain` indefinitely.
  minAvailable: ""
  # -- Maximum unavailable pods (mutually exclusive with minAvailable).
  # Default of 1 allows exactly one operator pod to be evicted at a time,
  # which is the only safe value when replicaCount=1 (drain proceeds; the
  # scheduler recreates the pod on another node).
  maxUnavailable: 1

# =============================================================================
# Horizontal Pod Autoscaler
# =============================================================================
autoscaling:
  # -- Enable HorizontalPodAutoscaler for the operator deployment.
  # Only useful when running multiple replicas.
  enabled: false
  # -- Minimum number of replicas
  minReplicas: 1
  # -- Maximum number of replicas
  maxReplicas: 3
  # -- Target average CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # -- Target average memory utilization percentage (optional)
  targetMemoryUtilizationPercentage: ""

# =============================================================================
# Scheduling
# =============================================================================

# -- Node selector labels for operator pod scheduling
nodeSelector: {}

# -- Tolerations for operator pod scheduling
tolerations: []

# -- Affinity rules for operator pod scheduling
affinity: {}

# -- Topology spread constraints for operator pod scheduling.
# Useful for spreading operator replicas across zones/nodes.
# Example:
#   topologySpreadConstraints:
#     - maxSkew: 1
#       topologyKey: topology.kubernetes.io/zone
#       whenUnsatisfiable: DoNotSchedule
#       labelSelector:
#         matchLabels:
#           app.kubernetes.io/name: aerospike-ce-kubernetes-operator
topologySpreadConstraints: []

# -- Priority class name for operator pod
priorityClassName: ""

# =============================================================================
# Extra annotations and labels
# =============================================================================

# -- Additional annotations to add to the operator pods
podAnnotations: {}

# -- Additional labels to add to the operator pods
podLabels: {}

# =============================================================================
# UI - Aerospike Cluster Manager
# =============================================================================
# The Aerospike Cluster Manager is a full-stack web dashboard deployed alongside
# the operator. It provides a visual interface for monitoring and managing
# Aerospike clusters in Kubernetes. The UI communicates with the Kubernetes API
# (via its own ServiceAccount/RBAC) to read and manage AerospikeCluster CRDs
# created by the operator. It does NOT communicate directly with the operator pod.
#
# Architecture:
#   [Browser] -> [UI Web :3100] -> [UI API :80→8000] -> [K8s API Server]
#                                                               |
#                                        [Operator] <----------+
#                                            |
#                                     [AerospikeCluster Pods]
#
# The UI requires a PostgreSQL database for storing session and configuration data.
# By default, an embedded PostgreSQL sidecar is deployed. For production, consider
# using an external PostgreSQL instance (set ui.postgresql.enabled=false and
# provide ui.env.databaseUrl).
# =============================================================================
ui:
  # -- Aerospike Cluster Manager web UI deployment toggles.
  # ui.api.enabled and ui.web.enabled are independent. Combinations:
  #   api.enabled=true,  web.enabled=true   (default) → both Deployments
  #   api.enabled=true,  web.enabled=false           → API only (Swagger / external UI)
  #   api.enabled=false, web.enabled=true            → Web only (point web.env.apiUrl at an external API)
  #   api.enabled=false, web.enabled=false           → operator only (no UI resources)
  # Access via:
  #   kubectl port-forward svc/<release>-aerospike-ce-kubernetes-operator-ui-web 3100:3100

  # -- Number of replicas for each UI Deployment (api / web)
  replicaCount: 1

  # -- Image pull secrets for private registries (applied to all UI Deployments)
  imagePullSecrets: []

  # -- Default tag for both UI components (api + web).
  # aerospike-cluster-manager is versioned independently from the operator,
  # so the chart pins a known-good cluster-manager release here rather than
  # letting the UI image tag fall through to .Chart.AppVersion (which is
  # the operator's version and may not exist as a cluster-manager tag).
  # Override per-component via ui.api.image.tag / ui.web.image.tag, or
  # set this to "" to fall through to .Chart.AppVersion.
  imageTag: "0.24.0"

  # =============================================================================
  # API (FastAPI) — port 8000 internally, Service port 80
  # =============================================================================
  api:
    # -- Deploy the API (FastAPI) component.
    # Set to false to deploy only the web frontend (then set
    # `ui.web.env.apiUrl` to your external API endpoint).
    enabled: true
    image:
      repository: ghcr.io/aerospike-ce-ecosystem/aerospike-cluster-manager-api
      # -- Container image tag. Leave empty to fall through to
      # ui.imageTag (preferred) or .Chart.AppVersion. See the
      # ui.api.image helper in _helpers.tpl.
      tag: ""
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      # -- Service port exposed (HTTP default 80). Traffic is forwarded to containerPort 8000.
      port: 80
      # -- Container port (non-privileged; required because container runs as non-root).
      targetPort: 8000
      annotations: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
    livenessProbe:
      httpGet:
        path: /api/health
        port: api
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /api/health
        port: api
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
    startupProbe:
      httpGet:
        path: /api/health
        port: api
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 30
    # -- Extra volumes attached to the api pod. Use together with
    # `extraVolumeMounts` and `ui.k8s.caFile` to mount a custom CA bundle for
    # K8s API verification on clusters whose API-server cert lacks the
    # Authority Key Identifier extension. Example:
    #   extraVolumes:
    #     - name: k8s-api-ca
    #       secret:
    #         secretName: my-k8s-api-ca
    #         items:
    #           - key: ca.crt
    #             path: ca.crt
    extraVolumes: []
    # -- Extra volume mounts on the api container. Example:
    #   extraVolumeMounts:
    #     - name: k8s-api-ca
    #       mountPath: /etc/ssl/k8s
    #       readOnly: true
    extraVolumeMounts: []

    # -- Extra environment variables passed to the api container.
    # Useful for plugin handler configuration (NELO_HOST, NELO_PROJECT_TOKEN, etc.)
    # Example:
    #   extraEnv:
    #     - name: NELO_HOST
    #       value: "nelo-collector.svc.cluster.local"
    extraEnv: []

    # -- envFrom entries (configMapRef / secretRef) for bulk env injection.
    # Example:
    #   extraEnvFrom:
    #     - secretRef:
    #         name: nelo-token
    extraEnvFrom: []

    # -- Additional Python packages installed by an init container into a
    # PYTHONPATH-mounted volume so plugin log handlers (pynelo, ddtrace, ...)
    # can be loaded without rebuilding the upstream image.
    #
    # Limitations: requires PyPI egress from the cluster, adds pod-startup
    # latency, may break with C extensions whose ABI mismatches the runtime
    # base image (python:3.14-slim by default). For airgap / locked-down
    # environments, build a custom image (FROM upstream + RUN pip install)
    # and override `image.repository` instead.
    extraPipPackages: []

    # =============================================================================
    # OpenTelemetry — opt-in observability (off by default).
    # All exporter / sampler / resource configuration goes through OTel SDK
    # standard environment variables. The chart only surfaces the ones needed
    # for the typical "send everything to a collector" path; see the OTel SDK
    # spec for the full list.
    # =============================================================================
    otel:
      # -- Enable OpenTelemetry export. When false the deployment sets
      # OTEL_SDK_DISABLED=true and the API uses NoOp providers.
      enabled: false
      # -- OTLP collector endpoint (gRPC: :4317, HTTP/protobuf: :4318)
      endpoint: ""
      # -- "grpc" or "http/protobuf"
      protocol: grpc
      # -- OTel SDK standard sampler. Common values:
      #   "parentbased_traceidratio" — child-of-parent + ratio fallback
      #   "always_on" / "always_off"
      sampler: parentbased_traceidratio
      # -- Sampler argument (ratio for traceidratio variants)
      samplerArg: "1.0"
      # -- service.name resource attribute
      serviceName: aerospike-cluster-manager-api
      # -- Comma-separated extra resource attributes
      # Example: "deployment.environment=staging,team=platform"
      resourceAttributes: ""
      # -- OTLP headers (auth tokens, etc.)
      # Example: "api-key=xxxxxxxx,x-tenant=foo"
      headers: ""

    # =============================================================================
    # OIDC (FastAPI bearer-token validation)
    # =============================================================================
    # Enables JWT bearer-token authentication on the FastAPI backend. The
    # api validates tokens against a Keycloak (or any OIDC-compliant) IdP
    # using a JWKS cache. The web SPA acquires the token via PKCE and
    # forwards it as `Authorization: Bearer <token>`.
    auth:
      oidc:
        # -- Enable OIDC bearer-token authentication on the API.
        # When false the API stays open (current behaviour, BC).
        enabled: false
        # -- OIDC issuer URL (used to discover JWKS / token endpoints).
        # Required when `enabled=true`. Example:
        #   issuerUrl: "https://keycloak.example.com/realms/acko"
        issuerUrl: ""
        # -- Expected `aud` claim. Tokens with a different audience are
        # rejected.
        audience: "acko-api"
        # -- Required role claims. A token must contain at least one of
        # these in its realm/client roles. Empty list = no role check
        # (any authenticated user is accepted).
        # Example: ["acko-admin", "acko-operator"]
        requiredRoles: []
        # -- JWKS cache TTL (Go-style duration string). Lower values
        # tighten key-rotation propagation at the cost of more JWKS HTTP
        # calls.
        jwksCacheTTL: "10m"
        # -- Paths bypassed by the auth middleware. Health/openapi/docs
        # must remain reachable for liveness probes and Swagger UI.
        excludePaths:
          - /api/health
          - /api/openapi.json
          - /api/docs

    # =============================================================================
    # Logging — pluggable handlers via LOG_HANDLERS or full dictConfig.
    # See aerospike-cluster-manager docs/logging.md for examples.
    # =============================================================================
    logging:
      # -- LOG_HANDLERS env value. Comma-separated list of handler specs:
      # "module.path:ClassName" or entry-point name registered under
      # "aerospike_cluster_manager.log_handlers".
      # Example: "pynelo:AsyncNeloHandler"
      handlers: ""
      # -- Path to an externally-mounted dictConfig file (when you mount it
      # via your own ConfigMap / Volume). Mutually exclusive with
      # `dictConfig` below.
      configFile: ""
      # -- dictConfig payload. When non-empty, the chart writes it to a
      # ConfigMap, mounts it at /etc/asm/logging.yaml, and sets
      # LOGGING_CONFIG_FILE accordingly. Example:
      #   dictConfig:
      #     version: 1
      #     handlers:
      #       console:
      #         class: logging.StreamHandler
      #     loggers:
      #       aerospike_cluster_manager_api:
      #         level: INFO
      #         handlers: [console]
      dictConfig: {}

      # =========================================================================
      # File mirror — writes log records to a rotating file on a shared
      # emptyDir so a sidecar shipper (fluent-bit, vector, promtail, ...) can
      # tail it. The api container reads LOG_FILE_PATH / LOG_FILE_MAX_BYTES /
      # LOG_FILE_BACKUP_COUNT — see aerospike-cluster-manager docs/logging.md
      # "Example C". Ignored when `logging.configFile` or `logging.dictConfig`
      # is set (dictConfig takes full ownership of the logging pipeline).
      # =========================================================================
      fileMirror:
        # -- Enable file mirror. Auto-mounts an emptyDir at `mountPath` on
        # both the api container and the sidecar (when enabled), so the
        # rotating file at `path` is visible to both.
        enabled: false
        # -- Mount root of the shared emptyDir inside both the api container
        # and the sidecar.
        mountPath: /var/log/acm
        # -- Log file the api process writes to. Must live under `mountPath`
        # so the sidecar can read it.
        path: /var/log/acm/api.log
        # -- Per-file size cap (bytes) before rotation. Default 50 MiB.
        maxBytes: 52428800
        # -- Number of rotated backups kept on disk.
        backupCount: 3

      # =========================================================================
      # Log-shipper sidecar (fluent-bit, vector, promtail, vendor-specific
      # collector, ...). The sidecar shares an emptyDir with the api container
      # at `fileMirror.mountPath` so it can tail the rotating file.
      #
      # `sidecar.enabled=true` requires `fileMirror.enabled=true` — without
      # the mirror, the sidecar would have nothing to tail. The chart fails
      # template rendering if the two are inconsistent so the misconfiguration
      # is caught at `helm install` time instead of as a silent no-op at
      # runtime.
      # =========================================================================
      sidecar:
        # -- Enable the log-shipper sidecar container.
        enabled: false
        # -- Sidecar container image. Pinned to a specific patch tag so
        # `helm upgrade` does not silently pull a new build under the
        # floating `3.2` alias. Bump deliberately when fluent-bit releases
        # a fix you want to take.
        image:
          repository: cr.fluentbit.io/fluent/fluent-bit
          tag: "3.2.10"
          pullPolicy: IfNotPresent
        # -- Override the image's entrypoint command. Leave empty to use the
        # image default.
        command: []
        # -- Override the image's CMD (arguments).
        args: []
        # -- Additional env vars passed to the sidecar (e.g. log shipper auth
        # tokens). Standard Kubernetes env-var schema.
        env: []
        # -- Resource requests/limits for the sidecar.
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        # -- Container-level securityContext applied to the sidecar.
        # runAsUser is pinned to 1001 to match `ui.podSecurityContext.runAsUser`
        # and `fsGroup` — the api container writes the rotating file as UID
        # 1001, and the sidecar must read it as the same UID/GID so the
        # contract holds even when the operator overrides the pod-level
        # securityContext to a different non-root user. Bump alongside any
        # change to `ui.podSecurityContext.runAsUser`.
        securityContext:
          runAsUser: 1001
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
        # -- Additional volume mounts on the sidecar container. Use together
        # with `ui.api.extraVolumes` to mount secrets, CA bundles, etc.
        extraVolumeMounts: []
        # -- Optional sidecar config file rendered into a ConfigMap and
        # mounted into the sidecar. When `content` is empty no ConfigMap is
        # created — the sidecar runs with the image's default config and the
        # operator is expected to bake one in or supply it via
        # `extraVolumeMounts`. The file format depends on the shipper:
        # fluent-bit conf, vector toml, promtail yaml, etc.
        config:
          # -- Path inside the sidecar where the file is mounted.
          mountPath: /fluent-bit/etc/fluent-bit.conf
          # -- ConfigMap key the file is stored under (also the subPath of
          # the volume mount).
          subPath: fluent-bit.conf
          # -- Raw file content. Empty disables the ConfigMap.
          content: ""

  # =============================================================================
  # Web (Next.js 14 + proxy.js sidecar) — port 3100
  # =============================================================================
  web:
    # -- Deploy the web (Next.js) component.
    # Set to false to deploy only the API backend (use Swagger / CLI tools
    # against the API Service directly).
    enabled: true
    image:
      repository: ghcr.io/aerospike-ce-ecosystem/aerospike-cluster-manager-web
      # -- Container image tag. Leave empty to fall through to
      # ui.imageTag (preferred) or .Chart.AppVersion. See the
      # ui.web.image helper in _helpers.tpl.
      tag: ""
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 3100
      annotations: {}
    # -- Web container env. proxy.js reads API_URL to forward /api/* requests.
    env:
      # -- External API URL. When set, web's proxy.js forwards /api/* there
      # instead of the in-cluster API Service. Required when
      # `ui.api.enabled=false` so the web frontend has somewhere to talk to.
      apiUrl: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 150m
        memory: 384Mi
    livenessProbe:
      httpGet:
        path: /
        port: web
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /
        port: web
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5

    # =============================================================================
    # OIDC (web SPA — Authorization Code + PKCE)
    # =============================================================================
    # When enabled, the chart writes `web-oidc-config.json` into a ConfigMap
    # mounted on the web pod so the SPA can fetch it at boot and configure
    # keycloak-js (or the equivalent OIDC client) without a rebuild.
    auth:
      oidc:
        # -- Enable OIDC login on the web SPA. When false the UI starts in
        # anonymous mode (current behaviour, BC).
        enabled: false
        # -- OIDC issuer URL (same realm as the API). Required when
        # `enabled=true`.
        issuerUrl: ""
        # -- Public client ID registered in Keycloak for the SPA. Defaults
        # to `acko-spa`.
        clientId: "acko-spa"
        # -- Redirect URI registered in the IdP. Typically the web origin
        # (e.g. https://acko.example.com/). Required when `enabled=true`.
        redirectUri: ""
        # -- OAuth2 / OIDC scopes requested at login. `openid` is mandatory
        # for OIDC; `profile`/`email` are useful for displaying user info.
        scopes:
          - openid
          - profile
          - email

  # =============================================================================
  # Service Account & RBAC
  # =============================================================================
  serviceAccount:
    # -- Create a service account for the UI
    create: true
    # -- Annotations for the UI service account
    annotations: {}

  rbac:
    # -- Create ClusterRole and ClusterRoleBinding for K8s API access
    create: true

  # =============================================================================
  # Ingress (routes to web Service by default; override target via ui.ingress.target)
  # =============================================================================
  ingress:
    # -- Enable ingress for external access
    enabled: false
    # -- Which UI Service the Ingress should route to: web | api
    target: web
    # -- Ingress class name
    className: ""
    # -- Ingress annotations
    annotations: {}
    # -- Ingress hosts
    hosts:
      - host: aerospike-admin.local
        paths:
          - path: /
            pathType: Prefix
    # -- Ingress TLS configuration
    tls: []

  # =============================================================================
  # PostgreSQL (Embedded Sidecar)
  # =============================================================================
  # The UI api requires a PostgreSQL database for storing cluster connection
  # metadata and session data. By default, a PostgreSQL container runs as a
  # sidecar in the same pod. For production deployments, disable this sidecar
  # and point ui.env.databaseUrl to a managed PostgreSQL instance (e.g., RDS,
  # Cloud SQL, AlloyDB).
  # NOTE: The embedded sidecar is single-instance only and incompatible with HPA.
  # =============================================================================
  postgresql:
    # -- Deploy an embedded PostgreSQL sidecar container.
    # Disable this and set env.databaseUrl to use an external PostgreSQL instance.
    enabled: true
    # -- PostgreSQL container image
    image:
      repository: postgres
      tag: "17-alpine"
      pullPolicy: IfNotPresent
    # -- Database name
    database: aerospike_manager
    # -- Database user
    username: aerospike
    # -- Database password (used for embedded sidecar only).
    # When empty (default), the chart auto-generates a 24-character random
    # password on first install via Helm's `lookup` + `randAlphaNum`. The
    # generated value is preserved across `helm upgrade` by re-reading the
    # existing Secret, so the password remains stable for the life of the
    # release. To override, set this to your own value or supply a complete
    # Secret via `ui.postgresql.existingSecret`. The previous default of
    # "aerospike" was a well-known credential and is no longer shipped.
    password: ""
    # -- Use an existing Secret instead of creating one.
    # The Secret must contain POSTGRES_PASSWORD and DATABASE_URL keys.
    existingSecret: ""
    # -- Resource requests and limits for the PostgreSQL sidecar
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

  # =============================================================================
  # Persistence (PostgreSQL data)
  # =============================================================================
  persistence:
    # -- Enable persistent storage for the embedded PostgreSQL database
    enabled: true
    # -- Storage class name for the PostgreSQL PVC.
    # null  = use cluster default StorageClass
    # ""    = disable dynamic provisioning (use pre-provisioned PV)
    # "name" = use the specified StorageClass (e.g., "rbd-ssd-user", "gp3")
    storageClassName: null
    # -- Access mode
    accessMode: ReadWriteOnce
    # -- Volume size
    size: 1Gi

  # =============================================================================
  # K8s Cluster Management
  # =============================================================================
  k8s:
    # -- Enable Kubernetes cluster management features (Create Cluster)
    enabled: true
    # -- Verify TLS certificates when connecting to the Kubernetes API server.
    # Set to false for clusters with self-signed or non-standard CA certificates
    # (e.g., Missing Authority Key Identifier).
    verifySsl: true
    # -- Path inside the api container to a custom CA bundle (PEM) used to
    # verify the K8s API-server certificate. Required on clusters whose
    # API-server cert is signed by a CA that lacks the Authority Key Identifier
    # extension — CPython 3.13+ rejects such chains by default. Mount the CA
    # via `ui.api.extraVolumes` / `ui.api.extraVolumeMounts`.
    # Example: "/etc/ssl/k8s/ca.crt"
    caFile: ""

  # =============================================================================
  # Security Context
  # =============================================================================
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  # =============================================================================
  # Environment
  # =============================================================================
  env:
    # -- API CORS origins (empty = no CORS; web proxies /api/* via Next.js rewrites in dev / proxy.js in prod)
    corsOrigins: ""
    # -- Log level (DEBUG, INFO, WARNING, ERROR)
    logLevel: "INFO"
    # -- Log format: "text" for human-readable output, "json" for structured logging
    logFormat: "text"
    # -- External PostgreSQL connection URL.
    # Only used when postgresql.enabled is false.
    # Example: "postgresql://user:pass@db-host:5432/aerospike_manager"
    databaseUrl: ""
    # -- DB connection pool size
    dbPoolSize: 5
    # -- Max overflow connections beyond pool size
    dbPoolOverflow: 10
    # -- Pool checkout timeout in seconds
    dbPoolTimeout: 30
    # -- Kubernetes API request timeout in seconds
    k8sApiTimeout: 30

  # =============================================================================
  # Monitoring - ServiceMonitor (Prometheus Operator)
  # =============================================================================
  metrics:
    serviceMonitor:
      # -- Create a ServiceMonitor resource for the UI api metrics endpoint
      enabled: false
      # -- Scrape interval (e.g., "30s")
      interval: 30s
      # -- Scrape timeout (e.g., "10s")
      scrapeTimeout: 10s
      # -- Additional labels for the ServiceMonitor (useful for Prometheus selection)
      labels: {}

  # =============================================================================
  # Scheduling
  # =============================================================================
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # -- Topology spread constraints for UI pod scheduling
  topologySpreadConstraints: []

  # -- Additional annotations to add to the UI pods
  podAnnotations: {}

  # -- Additional labels to add to the UI pods
  podLabels: {}

  # -- Termination grace period in seconds
  terminationGracePeriodSeconds: 45

  # =============================================================================
  # Host Network
  # =============================================================================
  # Use the node's network namespace for the UI pod. Useful for local/dev
  # clusters (e.g., Kind) that need to reach corporate Aerospike hosts via the
  # host's VPN/DNS resolver. When enabled, dnsPolicy defaults to
  # ClusterFirstWithHostNet so in-cluster DNS still works alongside host DNS.
  # WARNING: hostNetwork bypasses K8s network isolation and binds container
  # ports directly on the node. Do not enable in production.
  # -- Run the UI pod in the host network namespace
  hostNetwork: false

  # -- Override the pod dnsPolicy. When hostNetwork is true and this is empty,
  # defaults to ClusterFirstWithHostNet. Common values: ClusterFirst,
  # ClusterFirstWithHostNet, Default, None.
  dnsPolicy: ""

  # -- Additional Pod DNS configuration (searches, nameservers, options).
  # Useful for adding corporate search domains when connecting to internal
  # Aerospike clusters via short hostnames. Example:
  #   dnsConfig:
  #     searches:
  #       - nfra.io
  #       - navercorp.com
  dnsConfig: {}

  # =============================================================================
  # Aerospike Ports
  # =============================================================================
  aerospikePorts:
    # -- Aerospike service port
    service: 3000
    # -- Aerospike fabric port
    fabric: 3001
    # -- Aerospike heartbeat port
    heartbeat: 3002

  # =============================================================================
  # Network Policy
  # =============================================================================
  networkPolicy:
    # -- Enable NetworkPolicy for restricting UI ingress/egress traffic
    enabled: false
    # -- Optional ingress source restrictions (namespaceSelector, podSelector)
    ingressFrom: []

  # =============================================================================
  # Pod Disruption Budget
  # =============================================================================
  podDisruptionBudget:
    # -- Enable PodDisruptionBudget for UI pods
    enabled: false
    # -- Minimum number of pods that must remain available (mutually exclusive with maxUnavailable).
    # WARNING: with the default ui replicaCount=1, setting minAvailable=1
    # makes the UI pod un-evictable and blocks `kubectl drain` indefinitely.
    # Leave empty unless you scale ui replicas above 1.
    minAvailable: ""
    # -- Maximum number of pods that can be unavailable (mutually exclusive with minAvailable).
    # Default of 1 lets exactly one UI pod be evicted at a time, which is
    # the only safe value when ui replicaCount=1 (drain proceeds; the
    # scheduler recreates the pod on another node).
    maxUnavailable: 1

  # =============================================================================
  # Autoscaling (HPA)
  # =============================================================================
  autoscaling:
    # -- Enable Horizontal Pod Autoscaler for UI
    enabled: false
    # -- Minimum number of replicas
    minReplicas: 1
    # -- Maximum number of replicas
    maxReplicas: 3
    # -- Target CPU utilization percentage
    targetCPUUtilizationPercentage: 80
    # -- Target memory utilization percentage (optional, uncomment to enable)
    targetMemoryUtilizationPercentage: ""

  # =============================================================================
  # Extra Environment Variables
  # =============================================================================
  # -- Extra environment variables to set on the UI container.
  # These are added in addition to the default env vars from the ConfigMap and Secret.
  # Supports standard Kubernetes env var syntax including valueFrom references.
  # Example:
  #   extraEnv:
  #     - name: TZ
  #       value: "Asia/Seoul"
  #     - name: EXTERNAL_API_KEY
  #       valueFrom:
  #         secretKeyRef:
  #           name: my-secret
  #           key: api-key
  extraEnv: []

  # =============================================================================
  # Helm Tests
  # =============================================================================
  tests:
    # -- Enable Helm test pods for UI (run with `helm test <release>`)
    enabled: true


# =============================================================================
# Default AerospikeClusterTemplates
# =============================================================================
defaultTemplates:
  # -- Create pre-built AerospikeClusterTemplate resources.
  # Three tiers are provided: minimal (dev), soft-rack (stage), hard-rack (prod).
  # NOTE: AerospikeClusterTemplate is cluster-scoped. Templates are accessible from all namespaces.
  #
  # Default is false because the templates are AerospikeClusterTemplate custom
  # resources that share the same `helm install` transaction as the CRDs subchart.
  # Helm renders all manifests against the cluster's discovery cache, which
  # does not yet know about the AerospikeClusterTemplate kind during the first
  # install, so enabling this with crds.install=true causes "no matches for kind
  # AerospikeClusterTemplate" install failures. After the operator is installed
  # once and the CRDs are registered, set this to true (e.g. via `helm upgrade
  # --set defaultTemplates.enabled=true`) to add the bundled templates.
  enabled: false

  templates:
    minimal:
      description: >-
        Recommended for development. Runs as a single pod (1 Pod) without concern for PVC or network I/O performance.
        A minimal cluster focused solely on verifying feature behavior, suited for local or ephemeral development environments where fast iteration is needed.
      # image is set from aerospikeImages.aerospike via template
      size: 1
      monitoring:
        enabled: false
      scheduling:
        podAntiAffinityLevel: none
      storage:
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      aerospikeConfig:
        service:
          proto-fd-max: 1024
        namespaceDefaults:
          replication-factor: 1

    soft-rack:
      description: >-
        Recommended for staging. Deploys across multiple racks (3 or more) with local PVC guaranteed.
        However, multiple racks (Aerospike pods) may be co-located on the same Kubernetes node, so full node-level isolation is not guaranteed.
      scheduling:
        podAntiAffinityLevel: preferred
        tolerations:
          - key: "aerospike"
            operator: "Exists"
            effect: "NoSchedule"
      storage:
        storageClassName: standard
        resources:
          requests:
            storage: 10Gi
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "2Gi"
      aerospikeConfig:
        service:
          proto-fd-max: 4096
        namespaceDefaults:
          replication-factor: 2

    hard-rack:
      description: >-
        Recommended for production. Guarantees one rack per Kubernetes node (required anti-affinity) with local PVC.
        A minimum of 3 racks is recommended, providing full data locality and fault domain isolation.
      # image and exporterImage are set from aerospikeImages via template
      size: 6
      monitoring:
        enabled: true
        port: 9145
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        serviceMonitor:
          enabled: true
          interval: 30s
      scheduling:
        podAntiAffinityLevel: required
        tolerations:
          - key: "aerospike"
            operator: "Exists"
            effect: "NoSchedule"
      storage:
        storageClassName: local-path
        localPVRequired: true
        resources:
          requests:
            storage: 100Gi
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      rackConfig:
        maxRacksPerNode: 1
      aerospikeConfig:
        service:
          proto-fd-max: 15000
        namespaceDefaults:
          replication-factor: 2
