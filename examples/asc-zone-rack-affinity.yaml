# Scenario E: Zone-based Rack Affinity
#
# Verifies that a rack's zone field matches the node's topology.kubernetes.io/zone label,
# so pods are scheduled only on nodes belonging to the specified zone.
#
# Preconditions:
#   - soft-rack-test template
#   - Kind cluster nodes labeled with zones:
#       kind-worker:  zone-a
#       kind-worker2: zone-b
#       kind-worker3: zone-c
#
# Expected Results:
#   - All 3 pods Running
#   - rack 1 -> zone-a node, rack 2 -> zone-b node, rack 3 -> zone-c node
#
# Verification:
#   for pod in $(kubectl get pods -l app.kubernetes.io/instance=test-zone-racks -o jsonpath='{.items[*].metadata.name}'); do
#     node=$(kubectl get pod $pod -o jsonpath='{.spec.nodeName}')
#     zone=$(kubectl get node $node -o jsonpath='{.metadata.labels.topology\.kubernetes\.io/zone}')
#     rack=$(kubectl get pod $pod -o jsonpath='{.metadata.labels.acko\.io/rack}')
#     echo "Pod=$pod  Rack=$rack  Node=$node  Zone=$zone"
#   done
---
apiVersion: acko.io/v1alpha1
kind: AerospikeCluster
metadata:
  name: test-zone-racks
  namespace: default
spec:
  size: 3
  image: aerospike:ce-8.1.1.1
  templateRef:
    name: soft-rack-test
  rackConfig:
    namespaces:
      - data
    racks:
      - id: 1
        zone: zone-a
      - id: 2
        zone: zone-b
      - id: 3
        zone: zone-c
  aerospikeConfig:
    namespaces:
      - name: data
        replication-factor: 2
        storage-engine:
          type: memory
          data-size: 1073741824
