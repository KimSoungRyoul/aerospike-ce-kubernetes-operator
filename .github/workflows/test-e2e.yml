name: E2E Tests
# Deploy operator + Aerospike CE on Kind cluster, then run E2E tests (Podman auto-detected)

on:
  workflow_dispatch:
    inputs:
      ginkgo_label_filter:
        description: 'Ginkgo label filter (e.g. "!heavy")'
        required: false
        default: '!heavy'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      # charts/** stays ignored on purpose: this suite deploys the operator with
      # `make install` + `make deploy` (kustomize over config/), never with the
      # Helm chart — see test/e2e/e2e_suite_test.go:100-108. Running it on chart
      # changes would cost a 30-minute Kind run and exercise none of the chart.
      # Chart changes are guarded by the version check in lint.yml instead.
      - 'charts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least-privilege: e2e only reads the checked-out code.
permissions:
  contents: read

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    # Skip on PRs labeled 'heavy' so large/intentional PRs can opt out of e2e cost.
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'heavy')
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install kind
        # Pinned install via helm/kind-action. The previous unpinned
        # `curl https://kind.sigs.k8s.io/dl/latest/...` failed intermittently
        # with `curl: (6) Could not resolve host: kind.sigs.k8s.io` on GitHub
        # runners (#257). The action downloads the binary from GitHub
        # releases, which is always resolvable from GitHub-hosted runners.
        uses: helm/kind-action@v1
        with:
          version: v0.32.0
          install_only: true

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        # SKIP_KEYCLOAK=true skips the bitnami/keycloak helm install in
        # `setup-test-e2e`. The OIDC IdP is only needed by the
        # multi-cluster scenarios (run separately under e2e_pytest in
        # the plugins repo). Pulling bitnamilegacy/keycloak +
        # bitnamilegacy/postgresql + keycloak-config-cli on a fresh
        # CI runner repeatedly busted the chart's `--timeout 5m` and
        # this Go-based e2e suite does not exercise OIDC.
        env:
          SKIP_KEYCLOAK: "true"
        run: |
          go mod tidy
          make test-e2e GINKGO_FLAGS="-ginkgo.label-filter=${{ github.event.inputs.ginkgo_label_filter || '!heavy' }}"
