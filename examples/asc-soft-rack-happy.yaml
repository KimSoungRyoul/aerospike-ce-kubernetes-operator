# Scenario A: SoftRack Happy Path
#
# Verifies that the template's preferred anti-affinity (weight=100) spreads pods across different nodes.
# Since node count >= pod count, all pods are placed on separate nodes.
#
# Preconditions:
#   - soft-rack-test template (podAntiAffinityLevel: preferred)
#   - 3 or more Worker Nodes
#
# Expected Results:
#   - All 3 pods Running
#   - 1 pod placed on each of 3 different nodes
#
# Verification:
#   kubectl get pods -l app.kubernetes.io/instance=test-soft-happy -o wide
#   kubectl get pods -l app.kubernetes.io/instance=test-soft-happy \
#     -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' | sort -u | wc -l
#   # Expected: 3
---
apiVersion: acko.io/v1alpha1
kind: AerospikeCluster
metadata:
  name: test-soft-happy
  namespace: default
spec:
  size: 3
  image: aerospike:ce-8.1.1.1
  templateRef:
    name: soft-rack-test
  rackConfig:
    namespaces:
      - data
    racks:
      - id: 1
      - id: 2
      - id: 3
  aerospikeConfig:
    namespaces:
      - name: data
        replication-factor: 2
        storage-engine:
          type: memory
          data-size: 1073741824
