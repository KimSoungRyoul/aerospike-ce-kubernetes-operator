name: Lint
# On PR: run golangci-lint for Go static analysis

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'config/samples/**'
      - 'tokei.toml'
      - '.tokeignore'
      - '.gitignore'
      - 'LICENSE'
      - '.github/workflows/docs.yaml'
      - '.github/workflows/publish-chart.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'config/samples/**'
      - 'tokei.toml'
      - '.tokeignore'
      - '.gitignore'
      - 'LICENSE'
      - '.github/workflows/docs.yaml'
      - '.github/workflows/publish-chart.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least-privilege: linting only reads the checked-out code.
permissions:
  contents: read

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run linter
        run: make lint

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Run Helm lint
        run: make helm-lint

      # Guards #347: the in-repo chart sat at 1.3.2/1.3.1 for seven minors while
      # the release moved on, so `helm install ./charts/...` — the path the README
      # documents — deployed a stale operator. The publish workflow rewrites the
      # version from the tag, so nothing in CI ever exercised the committed values.
      - name: Check chart version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Resolve the latest published release so the staleness assertion is
          # enforced rather than skipped. A repo with no releases yet leaves this
          # empty and the script degrades to the consistency checks only.
          LATEST_RELEASE_TAG="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          export LATEST_RELEASE_TAG
          echo "Latest release: ${LATEST_RELEASE_TAG:-<none>}"
          make helm-check-version
