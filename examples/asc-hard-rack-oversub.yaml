# Scenario D: HardRack Oversubscribed (key difference test)
#
# required anti-affinity is a "hard" constraint, so if an Aerospike pod already exists
# on the same node, scheduling is rejected and the pod becomes Pending.
# rack 1 and rack 4 share the same nodeName (kind-worker) to intentionally trigger a conflict.
#
# Same conditions as SoftRack (Scenario B) but with different outcomes:
#   - SoftRack: all 4 pods Running (colocation allowed)
#   - HardRack: 3 pods Running + 1 pod Pending (colocation rejected)
#
# Preconditions:
#   - hard-rack-test template (podAntiAffinityLevel: required, maxRacksPerNode: 1)
#   - Kind cluster: kind-worker, kind-worker2, kind-worker3
#
# Expected Results:
#   - 3 pods Running, 1 pod Pending (rack 4)
#   - Pending reason: "didn't match pod anti-affinity rules"
#
# Verification:
#   kubectl get pods -l app.kubernetes.io/instance=test-hard-oversub -o wide
#   kubectl describe pod test-hard-oversub-4-0 | grep -A2 "Events:"
#   # Expected: FailedScheduling — pod anti-affinity rules
---
apiVersion: acko.io/v1alpha1
kind: AerospikeCluster
metadata:
  name: test-hard-oversub
  namespace: default
spec:
  size: 4
  image: aerospike:ce-8.1.1.1
  templateRef:
    name: hard-rack-test
  rackConfig:
    namespaces:
      - data
    racks:
      - id: 1
        nodeName: kind-worker
      - id: 2
        nodeName: kind-worker2
      - id: 3
        nodeName: kind-worker3
      - id: 4
        nodeName: kind-worker    # same node as rack 1 — Pending because HardRack
  aerospikeConfig:
    namespaces:
      - name: data
        replication-factor: 2
        storage-engine:
          type: memory
          data-size: 1073741824
