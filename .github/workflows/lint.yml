name: Lint
# On PR: run golangci-lint for Go static analysis

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'charts/**'
      - 'config/samples/**'
      - 'tokei.toml'
      - '.tokeignore'
      - '.gitignore'
      - 'LICENSE'
      - '.github/workflows/docs.yaml'
      - '.github/workflows/publish-chart.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'charts/**'
      - 'config/samples/**'
      - 'tokei.toml'
      - '.tokeignore'
      - '.gitignore'
      - 'LICENSE'
      - '.github/workflows/docs.yaml'
      - '.github/workflows/publish-chart.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least-privilege: linting only reads the checked-out code.
permissions:
  contents: read

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run linter
        run: make lint

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run Helm lint
        run: make helm-lint
