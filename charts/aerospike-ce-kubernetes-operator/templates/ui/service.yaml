{{- if .Values.ui.enabled }}
# =============================================================================
# API Service (port: 80 → targetPort: 8000)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aerospike-ce-kubernetes-operator.ui.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerospike-ce-kubernetes-operator.ui.api.labels" . | nindent 4 }}
  {{- with .Values.ui.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ui.api.service.type }}
  ports:
    - name: api
      port: {{ .Values.ui.api.service.port }}
      targetPort: api
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "aerospike-ce-kubernetes-operator.ui.api.selectorLabels" . | nindent 4 }}
---
# =============================================================================
# Web Service (Next.js) — port 3100
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aerospike-ce-kubernetes-operator.ui.web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerospike-ce-kubernetes-operator.ui.web.labels" . | nindent 4 }}
  {{- with .Values.ui.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ui.web.service.type }}
  ports:
    - name: web
      port: {{ .Values.ui.web.service.port }}
      targetPort: web
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "aerospike-ce-kubernetes-operator.ui.web.selectorLabels" . | nindent 4 }}
{{- end }}
