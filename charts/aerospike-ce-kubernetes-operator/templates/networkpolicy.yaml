{{- if eq (include "aerospike-ce-kubernetes-operator.operator.enabled" .) "true" }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aerospike-ce-kubernetes-operator.fullname" . }}-allow-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerospike-ce-kubernetes-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aerospike-ce-kubernetes-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              metrics: enabled
      ports:
        - port: 8443
          protocol: TCP
    {{- if .Values.webhook.enabled }}
    # Webhook port: ingress is intentionally unrestricted in standard NetworkPolicy.
    # Admission requests originate from kube-apiserver, which has no labelable
    # pod or namespace selector in core Kubernetes networking.k8s.io/v1. A
    # `from:` selector here would drop every admission request and break
    # cluster reconciliation. The Cilium variant (ciliumnetworkpolicy.yaml)
    # restricts this to `fromEntities: kube-apiserver`; standard NetworkPolicy
    # cannot express that and must allow ingress from all sources.
    - ports:
        - port: {{ .Values.webhook.port }}
          protocol: TCP
    {{- end }}
  egress:
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API server
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- if .Values.observability.otel.enabled }}
    # OpenTelemetry collector — OTLP export of traces/metrics/logs.
    # Without this egress rule the collector is unreachable when
    # networkPolicy.enabled is set and exported telemetry is silently dropped.
    # Port-scoped (no `to:` peer) to match the kube-apiserver rule above;
    # standard NetworkPolicy cannot select the collector by Service DNS name.
    - ports:
        - port: {{ .Values.observability.otel.collectorPort }}
          protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
