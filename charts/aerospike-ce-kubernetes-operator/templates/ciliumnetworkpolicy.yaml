{{- if eq (include "aerospike-ce-kubernetes-operator.operator.enabled" .) "true" }}
{{- if .Values.cilium.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "aerospike-ce-kubernetes-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerospike-ce-kubernetes-operator.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "aerospike-ce-kubernetes-operator.selectorLabels" . | nindent 6 }}
  ingress:
    # Allow metrics scraping (port 8443)
    - fromEndpoints:
        - {}
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
          {{- if .Values.cilium.l7Enabled }}
          rules:
            http:
              - method: GET
                path: "/metrics"
          {{- end }}
    {{- if .Values.webhook.enabled }}
    # Allow webhook traffic from kube-apiserver
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: {{ .Values.webhook.port | quote }}
              protocol: TCP
    {{- end }}
    # Allow health probes
    - fromEndpoints:
        - {}
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    # Allow DNS resolution
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Allow communication with kube-apiserver
    - toEntities:
        - kube-apiserver
    {{- if .Values.observability.otel.enabled }}
    # Allow OTLP export to the OpenTelemetry collector (traces/metrics/logs).
    # Without this the collector is unreachable when cilium.enabled is set and
    # exported telemetry is silently dropped. Scoped to the collector port for
    # any destination (in-cluster or external) — mirroring the port-scoped
    # rule in the standard NetworkPolicy, since the collector endpoint is
    # user-configured and cannot be matched by a fixed label selector here.
    - toEntities:
        - cluster
        - world
      toPorts:
        - ports:
            - port: {{ .Values.observability.otel.collectorPort | quote }}
              protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
