# SoftRack test template (lightweight for Kind environment)
#
# podAntiAffinityLevel: preferred
#   -> PreferredDuringSchedulingIgnoredDuringExecution (weight=100)
#   -> Colocation on the same node is allowed; spread preferred when possible
#
# Compared to the production soft-rack template (config/samples/acko_v1alpha1_template_stage.yaml),
# CPU/Memory/Storage are reduced to fit the Kind local environment.
---
apiVersion: acko.io/v1alpha1
kind: AerospikeClusterTemplate
metadata:
  name: soft-rack-test
spec:
  description: "Test SoftRack: preferred anti-affinity, light resources for Kind"
  image: aerospike:ce-8.1.1.1
  size: 3
  scheduling:
    podAntiAffinityLevel: preferred
  storage:
    storageClassName: standard
    resources:
      requests:
        storage: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  aerospikeConfig:
    service:
      proto-fd-max: 4096
    namespaceDefaults:
      replication-factor: 2
    network:
      heartbeat:
        mode: mesh
        interval: 150
        timeout: 10
