name: Agent Implement

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'plan-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code - Implement
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: '*'
          branch_prefix: 'agent/'
          prompt: |
            You are an AI implementation agent for the **aerospike-ce-kubernetes-operator** (ACKO) project.

            ## Project Context
            - **Structure**: Go/kubebuilder v4 with controller-runtime
            - **CRD types**: `api/v1alpha1/`
            - **Controllers**: `internal/controller/`
            - **Config generation**: `internal/configgen/`
            - **Build**: Go modules, Conventional Commits format
            - **Tests**: unit (`make test-unit`), integration with envtest

            ## Task
            Implement changes for issue #${{ github.event.issue.number }} based on the existing plan.

            ### Steps
            1. Read plan from issue comments (find `<!-- agent-plan-start -->`)
            2. Add `in-progress` label
            3. Implement following the plan's Proposed Changes and Strategy
            4. If CRD types change, run `make manifests generate`
            5. Verify: `go build ./...`, `go vet ./...`, `make test-unit`, `make lint`
            6. Commit with Conventional Commits format
            7. Create PR: `gh pr create --title "..." --body "Closes #${{ github.event.issue.number }}"`
            8. Add `needs-review` label to the issue

            ## Constraints
            - Follow Conventional Commits for all commits and PR title
            - Always read existing code before modifying
            - If verification fails, comment the error and stop
          claude_args: |
            --max-turns 30
            --dangerously-skip-permissions
          settings: '{"git":{"includeCoAuthor":false}}'
