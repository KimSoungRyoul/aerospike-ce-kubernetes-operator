{{- if or (eq (include "aerospike-ce-kubernetes-operator.operator.enabled" .) "true") (eq (include "aerospike-ce-kubernetes-operator.rbac.create" .) "true") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aerospike-ce-kubernetes-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerospike-ce-kubernetes-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aerospike-ce-kubernetes-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "aerospike-ce-kubernetes-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
