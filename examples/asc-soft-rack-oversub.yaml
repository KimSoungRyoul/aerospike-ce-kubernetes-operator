# Scenario B: SoftRack Oversubscribed (key difference test)
#
# preferred anti-affinity is a "soft" constraint, so when node count < pod count,
# multiple pods can colocate on the same node.
# rack 1 and rack 4 share the same nodeName (kind-worker) to force oversubscription.
#
# Preconditions:
#   - soft-rack-test template (podAntiAffinityLevel: preferred)
#   - Kind cluster: kind-worker, kind-worker2, kind-worker3
#
# Expected Results:
#   - **All 4 pods Running** (colocation allowed because soft constraint)
#   - 2 pods colocated on kind-worker, 1 pod on each remaining node
#
# Verification:
#   kubectl get pods -l app.kubernetes.io/instance=test-soft-oversub -o wide
#   kubectl get pods -l app.kubernetes.io/instance=test-soft-oversub \
#     -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' | sort | uniq -c
#   # Expected: 2 kind-worker, 1 kind-worker2, 1 kind-worker3
---
apiVersion: acko.io/v1alpha1
kind: AerospikeCluster
metadata:
  name: test-soft-oversub
  namespace: default
spec:
  size: 4
  image: aerospike:ce-8.1.1.1
  templateRef:
    name: soft-rack-test
  rackConfig:
    namespaces:
      - data
    racks:
      - id: 1
        nodeName: kind-worker
      - id: 2
        nodeName: kind-worker2
      - id: 3
        nodeName: kind-worker3
      - id: 4
        nodeName: kind-worker    # same node as rack 1 — colocation allowed because SoftRack
  aerospikeConfig:
    namespaces:
      - name: data
        replication-factor: 2
        storage-engine:
          type: memory
          data-size: 1073741824
