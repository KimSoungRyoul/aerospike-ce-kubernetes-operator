{{- if eq (include "aerospike-ce-kubernetes-operator.operator.enabled" .) "true" }}
{{- if .Values.defaultTemplates.enabled }}
{{- range $name, $spec := $.Values.defaultTemplates.templates }}
{{- $merged := deepCopy $spec }}
{{- /* Inject aerospikeImages.aerospike as default image if not explicitly set */ -}}
{{- if not (hasKey $merged "image") }}
{{- $_ := set $merged "image" $.Values.aerospikeImages.aerospike }}
{{- end }}
{{- /* Inject aerospikeImages.exporter into monitoring.exporterImage if monitoring is enabled */ -}}
{{- if and (hasKey $merged "monitoring") (index $merged "monitoring" | kindIs "map") }}
{{- $mon := index $merged "monitoring" }}
{{- if and (index $mon "enabled") (not (hasKey $mon "exporterImage")) }}
{{- $_ := set $mon "exporterImage" $.Values.aerospikeImages.exporter }}
{{- end }}
{{- end }}
---
apiVersion: acko.io/v1alpha1
kind: AerospikeClusterTemplate
metadata:
  name: {{ $name }}
  labels:
    {{- include "aerospike-ce-kubernetes-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: cluster-template
  # Intentionally NOT a Helm hook: hook resources are not part of the release
  # manifest, so `helm uninstall` would leave these AerospikeClusterTemplates
  # behind. A subsequent `helm install` then collides on the leaked names, and
  # toggling defaultTemplates.enabled false→true also breaks because Helm has
  # no record of the prior install. The CRD-existence precondition is enforced
  # by `aerospike-ce-kubernetes-operator.validate.defaultTemplatesNeedCRDs`
  # in _helpers.tpl, so we no longer need post-install/post-upgrade hooks to
  # stage creation after CRD installation.
spec:
  {{- toYaml $merged | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
