# HardRack test template (lightweight for Kind environment)
#
# podAntiAffinityLevel: required
#   -> RequiredDuringSchedulingIgnoredDuringExecution
#   -> Colocation on the same node is prohibited; maximum 1 pod per node enforced
#
# maxRacksPerNode: 1 — guarantees 1 rack per node (combined with required anti-affinity)
#
# Compared to the production hard-rack template (config/samples/acko_v1alpha1_template_prod.yaml),
# CPU/Memory/Storage are reduced to fit the Kind local environment.
---
apiVersion: acko.io/v1alpha1
kind: AerospikeClusterTemplate
metadata:
  name: hard-rack-test
spec:
  description: "Test HardRack: required anti-affinity, light resources for Kind"
  image: aerospike:ce-8.1.1.1
  size: 3
  scheduling:
    podAntiAffinityLevel: required
  storage:
    storageClassName: standard
    resources:
      requests:
        storage: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  rackConfig:
    maxRacksPerNode: 1
  aerospikeConfig:
    service:
      proto-fd-max: 4096
    namespaceDefaults:
      replication-factor: 2
    network:
      heartbeat:
        mode: mesh
        interval: 150
        timeout: 10
