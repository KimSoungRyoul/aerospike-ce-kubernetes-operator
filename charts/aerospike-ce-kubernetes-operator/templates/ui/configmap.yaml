{{- if eq (include "aerospike-ce-kubernetes-operator.ui.anyEnabled" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aerospike-ce-kubernetes-operator.ui.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerospike-ce-kubernetes-operator.ui.labels" . | nindent 4 }}
data:
  CORS_ORIGINS: {{ .Values.ui.env.corsOrigins | quote }}
  LOG_LEVEL: {{ .Values.ui.env.logLevel | quote }}
  LOG_FORMAT: {{ .Values.ui.env.logFormat | quote }}
  K8S_MANAGEMENT_ENABLED: {{ .Values.ui.k8s.enabled | quote }}
  # ui/proxy.js (and Next.js dev rewrites) consume this to forward /api/* to
  # the API Service. When ui.web.env.apiUrl is set, the web container talks
  # to an external API instead of the in-cluster Service — required when
  # ui.api.enabled=false but ui.web.enabled=true.
  API_URL: {{ if .Values.ui.web.env.apiUrl }}{{ .Values.ui.web.env.apiUrl | quote }}{{ else }}{{ printf "http://%s:%d" (include "aerospike-ce-kubernetes-operator.ui.api.fullname" .) (int .Values.ui.api.service.port) | quote }}{{ end }}
  WEB_PORT: {{ .Values.ui.web.service.port | quote }}
  API_PORT: {{ .Values.ui.api.service.targetPort | quote }}
  DB_POOL_SIZE: {{ .Values.ui.env.dbPoolSize | quote }}
  DB_POOL_OVERFLOW: {{ .Values.ui.env.dbPoolOverflow | quote }}
  DB_POOL_TIMEOUT: {{ .Values.ui.env.dbPoolTimeout | quote }}
  K8S_API_TIMEOUT: {{ .Values.ui.env.k8sApiTimeout | quote }}
  K8S_VERIFY_SSL: {{ .Values.ui.k8s.verifySsl | quote }}
  {{- with .Values.ui.k8s.caFile }}
  K8S_CA_FILE: {{ . | quote }}
  {{- end }}
  ENABLE_POSTGRES: {{ .Values.ui.postgresql.enabled | quote }}
  DEFAULT_AEROSPIKE_IMAGE: {{ .Values.aerospikeImages.aerospike | quote }}
  DEFAULT_EXPORTER_IMAGE: {{ .Values.aerospikeImages.exporter | quote }}
{{- end }}
{{- if and (eq (include "aerospike-ce-kubernetes-operator.ui.api.enabled" .) "true") .Values.ui.api.logging.dictConfig }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aerospike-ce-kubernetes-operator.ui.api.fullname" . }}-logging
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerospike-ce-kubernetes-operator.ui.api.labels" . | nindent 4 }}
data:
  logging.yaml: |
{{ toYaml .Values.ui.api.logging.dictConfig | indent 4 }}
{{- end }}
{{- if eq (include "aerospike-ce-kubernetes-operator.multiCluster.enabled" .) "true" }}
---
# Multi-cluster registry consumed by the web SPA at /cluster-registry.json.
# The SPA uses this list to pivot between ACKO API endpoints (one per env).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aerospike-ce-kubernetes-operator.clusterRegistryConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerospike-ce-kubernetes-operator.ui.web.labels" . | nindent 4 }}
data:
  cluster-registry.json: |
    {{- $registry := dict "defaultClusterId" .Values.multiCluster.defaultClusterId "clusters" .Values.multiCluster.clusters }}
    {{- toJson $registry | nindent 4 }}
{{- end }}
{{- if eq (include "aerospike-ce-kubernetes-operator.web.oidc.enabled" .) "true" }}
---
# SPA OIDC config consumed by the web pod at /web-oidc-config.json.
# The web frontend fetches this at boot to configure keycloak-js (issuer,
# clientId, redirectUri, scopes) without rebuilding the image per env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aerospike-ce-kubernetes-operator.webOidcConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerospike-ce-kubernetes-operator.ui.web.labels" . | nindent 4 }}
data:
  web-oidc-config.json: |
    {{- $oidc := dict "issuerUrl" .Values.ui.web.auth.oidc.issuerUrl "clientId" .Values.ui.web.auth.oidc.clientId "redirectUri" .Values.ui.web.auth.oidc.redirectUri "scopes" .Values.ui.web.auth.oidc.scopes }}
    {{- toJson $oidc | nindent 4 }}
{{- end }}
